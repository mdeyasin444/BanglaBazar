<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus SaaS | Enterprise AI Platform</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['Fira Code', 'monospace'] },
                    colors: {
                        primary: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
                        slate: { 850: '#1e293b', 900: '#0f172a', 950: '#020617' }
                    }
                }
            }
        }
    </script>

    <style>
        /* Base Setup */
        body { font-family: 'Inter', sans-serif; height: 100dvh; width: 100vw; overflow: hidden; display: flex; }
        
        /* Markdown Styling */
        .prose p { margin-bottom: 0.8em; line-height: 1.6; }
        .prose pre { background: #1e1e1e !important; padding: 12px; border-radius: 8px; margin: 10px 0; overflow-x: auto; }
        .prose code { font-family: 'Fira Code', monospace; font-size: 0.9em; }
        .prose ul { list-style-type: disc; padding-left: 20px; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        /* Mobile specific fixes */
        .mobile-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; background: rgba(0,0,0,0.5); }
    </style>
</head>
<body class="bg-gray-50 text-slate-800 dark:bg-slate-950 dark:text-slate-200">

    <aside id="sidebar" class="w-72 bg-white dark:bg-slate-900 border-r border-gray-200 dark:border-slate-800 flex flex-col transition-all duration-300 transform -translate-x-full md:translate-x-0 absolute md:relative h-full z-40">
        
        <div class="p-5 border-b border-gray-100 dark:border-slate-800 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-primary-600 rounded-lg flex items-center justify-center text-white">
                    <i class="ph-bold ph-cube"></i>
                </div>
                <h1 class="font-bold text-lg tracking-tight">Nexus SaaS</h1>
            </div>
            <button onclick="toggleSidebar()" class="md:hidden text-slate-500"><i class="ph-bold ph-x"></i></button>
        </div>

        <div class="flex-1 overflow-y-auto p-3 space-y-1" id="history-list">
            </div>

        <div class="p-4 border-t border-gray-100 dark:border-slate-800">
            <button onclick="openSettings()" class="flex items-center gap-3 w-full p-3 hover:bg-gray-100 dark:hover:bg-slate-800 rounded-xl transition-all text-sm font-medium text-slate-600 dark:text-slate-400">
                <i class="ph-bold ph-gear"></i> Settings & API
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full relative w-full">
        
        <header class="h-14 bg-white/80 dark:bg-slate-900/80 backdrop-blur border-b border-gray-200 dark:border-slate-800 flex items-center justify-between px-4 shrink-0 z-30">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="md:hidden p-2 hover:bg-gray-100 rounded-lg"><i class="ph-bold ph-list text-xl"></i></button>
                <div class="flex flex-col">
                    <h2 id="current-chat-name" class="font-bold text-sm truncate max-w-[150px] md:max-w-md">New Workspace</h2>
                    <span class="text-[10px] text-green-500 font-bold uppercase tracking-wider flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span> Live Connection
                    </span>
                </div>
            </div>
            
            <div class="flex gap-2">
                <button onclick="createNewChat()" class="p-2 bg-primary-600 text-white rounded-lg text-sm flex items-center gap-2 hover:bg-primary-700 transition-shadow shadow-lg shadow-primary-500/20">
                    <i class="ph-bold ph-plus"></i> <span class="hidden md:inline">New Chat</span>
                </button>
                <button onclick="toggleTheme()" class="p-2 text-slate-500 hover:bg-gray-100 dark:hover:bg-slate-800 rounded-lg">
                    <i id="theme-icon" class="ph-bold ph-moon"></i>
                </button>
            </div>
        </header>

        <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 scroll-smooth">
            <div id="empty-state" class="h-full flex flex-col items-center justify-center opacity-50">
                <i class="ph-duotone ph-cpu text-6xl text-primary-500 mb-4"></i>
                <h3 class="text-xl font-bold">Ready to Work</h3>
                <p class="text-sm">Connect your API key to start real production tasks.</p>
            </div>
            <div id="messages-area" class="max-w-3xl mx-auto space-y-6 pb-4"></div>
        </div>

        <div class="shrink-0 bg-white dark:bg-slate-900 border-t border-gray-200 dark:border-slate-800 p-4 z-30">
            <div class="max-w-3xl mx-auto relative">
                <div class="absolute -top-10 left-0 flex gap-2">
                    <select id="model-select" class="text-xs bg-gray-100 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-full px-3 py-1 outline-none">
                        <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                        <option value="gpt-4">GPT-4</option>
                        <option value="google/gemini-pro">Gemini Pro</option>
                    </select>
                </div>

                <div class="flex items-end gap-2 bg-gray-50 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-2xl p-2 focus-within:ring-2 focus-within:ring-primary-500/20 transition-all">
                    <button onclick="handleVoice()" id="mic-btn" class="p-3 text-slate-400 hover:text-red-500 transition-colors rounded-xl"><i class="ph-bold ph-microphone text-lg"></i></button>
                    
                    <textarea id="user-input" rows="1" class="w-full bg-transparent border-none outline-none py-3 text-slate-700 dark:text-slate-200 resize-none max-h-32 placeholder-slate-400" placeholder="Type a message..." oninput="autoResize(this)" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); sendMessage()}"></textarea>
                    
                    <button onclick="sendMessage()" id="send-btn" class="p-3 bg-primary-600 hover:bg-primary-700 text-white rounded-xl transition-all shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="ph-bold ph-paper-plane-right-fill text-lg"></i>
                    </button>
                </div>
                <div class="text-center mt-2">
                    <p class="text-[10px] text-slate-400">Production Mode • History Saved Locally</p>
                </div>
            </div>
        </div>
    </main>

    <dialog id="settings-modal" class="backdrop:bg-slate-900/60 p-0 rounded-2xl shadow-2xl w-full max-w-md bg-white dark:bg-slate-900 border border-gray-100 dark:border-slate-800 text-slate-800 dark:text-slate-100">
        <div class="p-6">
            <h3 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="ph-bold ph-key"></i> API Configuration</h3>
            
            <div class="space-y-4">
                <div class="p-3 bg-blue-50 dark:bg-slate-800 rounded-lg text-xs text-blue-600 dark:text-blue-400">
                    <strong>Note:</strong> This is a real SaaS tool. You must provide a valid API Key. Keys are stored <strong>only in your browser</strong>.
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase mb-1">Base URL</label>
                    <input id="api-url" value="https://openrouter.ai/api/v1" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-950 border border-gray-200 dark:border-slate-800 outline-none text-sm font-mono" placeholder="https://api.openai.com/v1">
                </div>
                
                <div>
                    <label class="block text-xs font-bold uppercase mb-1">API Key</label>
                    <input id="api-key" type="password" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-950 border border-gray-200 dark:border-slate-800 outline-none text-sm font-mono" placeholder="sk-...">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase mb-1">System Prompt</label>
                    <textarea id="sys-prompt" rows="2" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-slate-950 border border-gray-200 dark:border-slate-800 outline-none text-sm">You are a helpful expert assistant.</textarea>
                </div>
            </div>

            <div class="mt-6 flex justify-end gap-2">
                <button onclick="document.getElementById('settings-modal').close()" class="px-4 py-2 rounded-lg text-sm hover:bg-gray-100 dark:hover:bg-slate-800">Close</button>
                <button onclick="saveSettings()" class="px-4 py-2 bg-primary-600 text-white rounded-lg text-sm font-bold shadow-lg shadow-primary-500/20">Save & Connect</button>
            </div>
        </div>
    </dialog>

    <script>
        // --- 1. REAL STATE MANAGEMENT ---
        const state = {
            config: JSON.parse(localStorage.getItem('nexus_config') || '{"apiUrl":"https://openrouter.ai/api/v1","apiKey":"","sysPrompt":"You are a helpful assistant."}'),
            chats: JSON.parse(localStorage.getItem('nexus_chats') || '[]'),
            activeId: null,
            isGenerating: false
        };

        // --- 2. INITIALIZATION ---
        window.onload = () => {
            if(!state.config.apiKey) openSettings();
            renderHistory();
            if(state.chats.length > 0) loadChat(state.chats[0].id);
            updateThemeUI();
        };

        // --- 3. CORE CHAT LOGIC (NO DEMO) ---
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const txt = input.value.trim();
            if(!txt || state.isGenerating) return;
            
            if(!state.config.apiKey) { alert("API Key Missing! Check Settings."); openSettings(); return; }

            // 1. Prepare UI
            if(!state.activeId) createNewChat();
            const chat = state.chats.find(c => c.id === state.activeId);
            
            // Add User Msg
            chat.messages.push({ role: 'user', content: txt });
            if(chat.messages.length === 1) chat.title = txt.slice(0, 30);
            
            input.value = '';
            autoResize(input);
            renderMessages();

            // 2. Add Assistant Placeholder
            state.isGenerating = true;
            chat.messages.push({ role: 'assistant', content: '', pending: true });
            renderMessages();
            updateSendBtnState();

            // 3. REAL API CALL (Stream)
            try {
                const response = await fetch(`${state.config.apiUrl}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${state.config.apiKey}`,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': window.location.href // Required for OpenRouter
                    },
                    body: JSON.stringify({
                        model: document.getElementById('model-select').value,
                        messages: [
                            { role: 'system', content: state.config.sysPrompt },
                            ...chat.messages.slice(0, -1).map(m => ({role: m.role, content: m.content}))
                        ],
                        stream: true
                    })
                });

                if(!response.ok) throw new Error(`API Error: ${response.status}`);

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';
                const lastMsgIndex = chat.messages.length - 1;

                while(true) {
                    const { done, value } = await reader.read();
                    if(done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for(const line of lines) {
                        if(line.startsWith('data: ') && line !== 'data: [DONE]') {
                            try {
                                const data = JSON.parse(line.slice(6));
                                const content = data.choices[0]?.delta?.content || '';
                                fullText += content;
                                chat.messages[lastMsgIndex].content = fullText;
                                
                                // Live DOM Update (Performance Optimized)
                                const msgDiv = document.getElementById(`msg-${lastMsgIndex}`);
                                if(msgDiv) msgDiv.innerHTML = marked.parse(fullText);
                                
                                // Auto Scroll
                                const container = document.getElementById('chat-container');
                                if(container.scrollHeight - container.scrollTop < 800) {
                                    container.scrollTop = container.scrollHeight;
                                }
                            } catch(e) {}
                        }
                    }
                }
                
                chat.messages[lastMsgIndex].pending = false;
                
            } catch (err) {
                chat.messages[state.chats.find(c => c.id === state.activeId).messages.length - 1].content = `**Error:** ${err.message}. Please check your API Key.`;
                renderMessages();
            } finally {
                state.isGenerating = false;
                updateSendBtnState();
                saveData();
                renderHistory();
                
                // Highlight Code Blocks
                document.querySelectorAll('pre code').forEach(hljs.highlightElement);
            }
        }

        // --- 4. RENDERERS ---
        function renderMessages() {
            const chat = state.chats.find(c => c.id === state.activeId);
            const area = document.getElementById('messages-area');
            const empty = document.getElementById('empty-state');
            const title = document.getElementById('current-chat-name');

            if(!chat) return;

            if(chat.messages.length === 0) {
                area.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            title.innerText = chat.title;

            area.innerHTML = chat.messages.map((m, i) => `
                <div class="flex gap-4 ${m.role === 'user' ? 'flex-row-reverse' : ''} group">
                    <div class="w-8 h-8 rounded-lg shrink-0 flex items-center justify-center ${m.role === 'user' ? 'bg-primary-600 text-white' : 'bg-white dark:bg-slate-800 border dark:border-slate-700 shadow-sm'}">
                        <i class="ph-bold ${m.role === 'user' ? 'ph-user' : 'ph-robot'}"></i>
                    </div>
                    <div class="max-w-[85%]">
                        <div class="prose prose-sm dark:prose-invert p-4 rounded-2xl shadow-sm ${m.role === 'user' ? 'bg-primary-600 text-white rounded-tr-none' : 'bg-white dark:bg-slate-800 dark:border-slate-700 border border-gray-100 rounded-tl-none'}">
                            <div id="msg-${i}" class="${m.pending ? 'animate-pulse' : ''}">${marked.parse(m.content)}</div>
                        </div>
                    </div>
                </div>
            `).join('');

            // Scroll to bottom on new render
            const container = document.getElementById('chat-container');
            container.scrollTop = container.scrollHeight;
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = state.chats.map(c => `
                <div onclick="loadChat(${c.id})" class="p-3 rounded-xl cursor-pointer hover:bg-gray-100 dark:hover:bg-slate-800 flex items-center gap-3 transition-all ${state.activeId === c.id ? 'bg-blue-50 dark:bg-slate-800 border-l-4 border-primary-600' : ''}">
                    <i class="ph ph-chat-circle text-slate-400"></i>
                    <div class="flex-1 truncate">
                        <p class="text-sm font-medium text-slate-700 dark:text-slate-200 truncate">${c.title}</p>
                        <p class="text-[10px] text-slate-400">${new Date(c.id).toLocaleDateString()}</p>
                    </div>
                    <button onclick="deleteChat(${c.id}, event)" class="text-slate-300 hover:text-red-500"><i class="ph-bold ph-trash"></i></button>
                </div>
            `).join('');
        }

        // --- 5. DATA & SETTINGS ---
        function createNewChat() {
            const id = Date.now();
            state.chats.unshift({ id, title: 'New Workspace', messages: [] });
            state.activeId = id;
            saveData();
            renderHistory();
            renderMessages();
            if(window.innerWidth < 768) toggleSidebar();
        }

        function loadChat(id) {
            state.activeId = id;
            renderMessages();
            renderHistory(); // Update active highlight
            if(window.innerWidth < 768) document.getElementById('sidebar').classList.add('-translate-x-full');
        }

        function deleteChat(id, e) {
            e.stopPropagation();
            if(confirm('Permanently delete this workspace?')) {
                state.chats = state.chats.filter(c => c.id !== id);
                if(state.activeId === id) state.activeId = state.chats[0]?.id || null;
                saveData();
                renderHistory();
                renderMessages();
            }
        }

        function saveSettings() {
            state.config.apiUrl = document.getElementById('api-url').value;
            state.config.apiKey = document.getElementById('api-key').value;
            state.config.sysPrompt = document.getElementById('sys-prompt').value;
            localStorage.setItem('nexus_config', JSON.stringify(state.config));
            document.getElementById('settings-modal').close();
            alert("Connection Saved. Ready to Chat.");
        }

        function saveData() { localStorage.setItem('nexus_chats', JSON.stringify(state.chats)); }
        
        // --- 6. UTILITIES ---
        function autoResize(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
        
        function toggleSidebar() { 
            const sb = document.getElementById('sidebar');
            sb.classList.toggle('-translate-x-full');
        }

        function openSettings() {
            document.getElementById('api-url').value = state.config.apiUrl;
            document.getElementById('api-key').value = state.config.apiKey;
            document.getElementById('sys-prompt').value = state.config.sysPrompt;
            document.getElementById('settings-modal').showModal();
        }

        function updateSendBtnState() {
            const btn = document.getElementById('send-btn');
            btn.disabled = state.isGenerating;
            btn.innerHTML = state.isGenerating ? '<i class="ph-bold ph-spinner animate-spin text-lg"></i>' : '<i class="ph-bold ph-paper-plane-right-fill text-lg"></i>';
        }

        function handleVoice() {
            if(!('webkitSpeechRecognition' in window)) return alert("Voice not supported in this browser");
            const recognition = new webkitSpeechRecognition();
            recognition.lang = 'en-US';
            document.getElementById('mic-btn').classList.add('text-red-500', 'animate-pulse');
            recognition.onresult = (e) => {
                document.getElementById('user-input').value += ' ' + e.results[0][0].transcript;
                autoResize(document.getElementById('user-input'));
            };
            recognition.onend = () => document.getElementById('mic-btn').classList.remove('text-red-500', 'animate-pulse');
            recognition.start();
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
            updateThemeUI();
        }

        function updateThemeUI() {
            const isDark = localStorage.getItem('theme') === 'dark';
            if(isDark) document.documentElement.classList.add('dark');
            document.getElementById('theme-icon').className = isDark ? 'ph-bold ph-sun' : 'ph-bold ph-moon';
        }
    </script>
</body>
</html>
